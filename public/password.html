<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Change password · Payment Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/app.css" />
</head>

<body>
    <header id="topbar" class="topbar"></header>

    <main class="page page-narrow">
        <h1>Change password</h1>
        <div id="forcedNotice" class="msg msg-info" hidden>For security, set your own password before you continue.
        </div>
        <div id="message" tabindex="-1" hidden></div>

        <form id="pwForm" class="panel" novalidate>
            <div class="field">
                <label for="current">Current password</label>
                <input id="current" class="input" type="password" autocomplete="current-password" />
            </div>
            <div class="field">
                <label for="next">New password</label>
                <input id="next" class="input" type="password" autocomplete="new-password"
                    aria-describedby="nextHint" />
                <p id="nextHint" class="hint">At least 8 characters.</p>
            </div>
            <div class="field">
                <label for="confirm">Type the new password again</label>
                <input id="confirm" class="input" type="password" autocomplete="new-password" />
            </div>
            <label class="check"><input type="checkbox" id="showPw" /> Show passwords</label>
            <button id="submitBtn" class="btn btn-primary btn-block mt-2">Save new password</button>
        </form>
    </main>

    <script src="/js/ui.js"></script>
    <script src="/js/password.js"></script>
</body>

</html>
