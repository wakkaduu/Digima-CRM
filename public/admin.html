<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin · Payment Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 text-slate-800">
    <main class="max-w-3xl mx-auto p-4 sm:p-6 space-y-5">
        <header class="flex items-center justify-between gap-3">
            <h1 class="text-xl font-semibold">Pending Payments</h1>
            <div class="flex items-center gap-3 text-sm text-slate-500">
                <a href="/setup.html" class="underline">QuickBooks setup</a>
                <button id="refreshBtn" class="hidden underline">Refresh</button>
                <span id="userBar" class="hidden"><span id="userName"></span> ·
                    <button id="logoutBtn" class="underline">Log out</button></span>
            </div>
        </header>

        <section id="loginCard" class="hidden bg-white rounded-xl border shadow-sm p-5 space-y-3">
            <h2 class="font-medium">Admin log in</h2>
            <form id="loginForm" class="space-y-2">
                <input id="loginName" required minlength="2" placeholder="Your full name"
                    class="w-full border rounded px-3 py-2" />
                <input id="loginCode" type="password" required placeholder="Admin access code"
                    class="w-full border rounded px-3 py-2" />
                <button class="w-full bg-slate-900 text-white rounded px-4 py-2">Log in</button>
            </form>
            <p id="loginError" class="text-sm text-red-600"></p>
        </section>

        <div id="toast" class="hidden rounded px-3 py-2 text-sm"></div>
        <p id="count" class="hidden text-sm text-slate-500"></p>
        <section id="list" class="space-y-4"></section>
    </main>
    <script src="/js/admin.js"></script>
</body>

</html>
