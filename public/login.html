<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log in · Payment Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/app.css" />
</head>

<body>
    <header class="topbar">
        <div class="topbar-inner"><span class="brand">Payment Portal</span></div>
    </header>

    <main class="page page-narrow">
        <h1>Log in</h1>
        <div id="message" hidden></div>

        <form id="loginForm" class="panel" novalidate>
            <div class="field">
                <label for="email">Email address</label>
                <input id="email" class="input" type="email" autocomplete="username" />
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input id="password" class="input" type="password" autocomplete="current-password" />
            </div>
            <label class="check"><input type="checkbox" id="showPw" /> Show password</label>
            <button id="submitBtn" class="btn btn-primary btn-block mt-2">Log in</button>
            <p class="hint mt-3">Forgot your password? Ask an admin to reset it.</p>
        </form>
    </main>

    <script src="/js/ui.js"></script>
    <script src="/js/login.js"></script>
</body>

</html>
