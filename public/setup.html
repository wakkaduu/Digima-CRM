<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Setup · Payment Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 text-slate-800">
    <main class="max-w-2xl mx-auto p-6 space-y-6">
        <h1 class="text-2xl font-semibold">Admin Setup</h1>

        <section class="bg-white rounded-xl shadow-sm border p-5 space-y-3">
            <h2 class="font-medium">1. Log in</h2>
            <form id="loginForm" class="flex flex-wrap gap-2">
                <input id="name" placeholder="Your name" required
                    class="border rounded px-3 py-2 flex-1 min-w-[140px]" />
                <input id="code" type="password" placeholder="Admin access code" required
                    class="border rounded px-3 py-2 flex-1 min-w-[140px]" />
                <button class="bg-slate-900 text-white rounded px-4 py-2">Log in</button>
            </form>
            <p id="whoami" class="text-sm text-slate-500"></p>
        </section>

        <section class="bg-white rounded-xl shadow-sm border p-5 space-y-3">
            <h2 class="font-medium">2. QuickBooks connection</h2>
            <p id="qboStatus" class="text-sm text-slate-600">Checking…</p>
            <a href="/api/auth/qbo" class="inline-block bg-green-600 text-white rounded px-4 py-2">Connect to
                QuickBooks</a>
        </section>

        <section class="bg-white rounded-xl shadow-sm border p-5 space-y-3">
            <h2 class="font-medium">3. Test: fetch open estimates</h2>
            <button id="loadBtn" class="bg-blue-600 text-white rounded px-4 py-2">Load estimates</button>
            <pre id="out" class="text-xs bg-slate-100 rounded p-3 overflow-auto max-h-96"></pre>
        </section>
    </main>
    <script src="/js/setup.js"></script>
</body>

</html>
